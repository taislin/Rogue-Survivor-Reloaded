# Publish a desktop release.
#
# Manual only (`workflow_dispatch`). Nothing here runs on push, and that is the
# point: a release is irreversible in the ways that matter. The tag, the archives
# attached to it, and the fact that a version number now exists in package.json
# are all things you would rather create deliberately than have CI do because
# somebody merged.
#
# It builds and uploads exactly the three archives `npm run build:release`
# produces, and adds nothing of its own to the archives themselves:
#
#   web/dist-release/rogue_survivor_reloaded-win-<version>-<commit>.zip
#   web/dist-release/rogue_survivor_reloaded-linux-<version>-<commit>.zip
#   web/dist-release/rogue_survivor_reloaded-mac-<version>-<commit>.zip
#
# `scripts/build-release.mjs` does the packaging, including the zip writer and
# the Unix exec bits, and its header explains why those live in a script rather
# than in a shell pipeline. This workflow's only jobs are to run it on Linux,
# publish what an installed build updates itself from, and attach the archives.
#
# THE PAYLOAD BRANCH. Alongside the release, one archive's `dist/` is pushed to a
# single-commit `payload` branch, force-pushed, before the release is created.
# That is the update channel: an installed desktop build fetches `latest.json`
# from it on launch to decide whether to offer an update, and `payload.json` —
# which `build-release.mjs` writes into every platform folder — plus the files
# whose sha changed when one is taken. So an update is a few megabytes rather
# than a 50 MB archive, and the two channels cannot disagree about the version:
# both come from one run of this workflow reading `package.json` once.
#
# WHY THREE JOBS. The build runs `npm ci` and executes a Vite + Neutralino build
# tree; the other two need `contents: write` — one to push a branch, one to
# create a tag and a release. Splitting them means the job that runs third-party
# code holds a token that cannot push anything, and the exact bytes that get
# published are handed over as an artifact rather than being produced by the same
# step that uploads them.
#
# WHY PAYLOAD BEFORE PUBLISH. `publish` needs `payload` as well as `build`, so
# the branch exists before the release that advertises it. The alternative — both
# needing only `build`, so they run in parallel — opens a window in which
# `releases/latest` names a version whose files are not on the branch yet, which
# is exactly the state a player's update check must never observe.
#
# WHY NO TEST STEP. `npm run build:release` shells out to `npm run build:desktop`,
# which runs `npm run build`, which is `tsc -p tsconfig.json && vite build` - and
# `tsconfig.json`'s include list is `["src", "sim", "tests", "vitest.config.mts"]`.
# So the release build already type-checks the test suite, and a compile error
# anywhere in it fails the release. Behavioural coverage is CI's job
# (`.github/workflows/ci.yml`); re-running the full suite here would add minutes
# to a manual run without closing a gap that is not already closed on push to the
# default branch.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. Blank = v<version> from web/package.json."
        type: string
        default: ""
      notes:
        description: "Release notes (Markdown). Blank = an auto-generated asset list with sizes and checksums."
        type: string
        default: ""
      draft:
        description: "Create as a draft, for a human to publish."
        type: boolean
        default: false
      prerelease:
        description: "Mark as a pre-release rather than latest."
        type: boolean
        default: false
      dry_run:
        description: "Build and check the archives, but publish nothing."
        type: boolean
        default: true
      allow_off_default_branch:
        description: "Allow publishing from a branch that is not the default. The tag will point at that branch's commit."
        type: boolean
        default: false

# Read-only by default. Only the payload and publish jobs are granted write, so a
# build that goes wrong cannot push a branch or a tag as a side effect.
permissions:
  contents: read

# Serialise, do not cancel. Two releases of the same project racing each other
# would race the tag, and a half-cancelled run is worse than a queued one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: build release archives
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Refuse to build a release off the default branch
        # A tag is just a pointer, so without this a run dispatched from a
        # feature branch publishes a plausible-looking official build of work in
        # progress. `inputs.*` is interpolated into the shell, so the booleans
        # come in as env vars and are compared as strings rather than trusted.
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALLOW_OFF: ${{ inputs.allow_off_default_branch }}
        run: |
          set -euo pipefail
          if [ "$ALLOW_OFF" = "true" ]; then
            echo "allow_off_default_branch is set; building from $REF"
            exit 0
          fi
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::refusing to build a release from $REF"
            echo "::error::the default branch is $DEFAULT_BRANCH - dispatch from there, or tick"
            echo "::error::'allow_off_default_branch' if you really mean this commit"
            exit 1
          fi
          echo "building from the default branch ($DEFAULT_BRANCH)"

      - name: Record what is being released
        # Read once and passed on, so the tag the release gets and the tag baked
        # into the three filenames come from the same value rather than from two
        # reads of a file that could change between them.
        id: meta
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          commit="$(git rev-parse --short HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "building $version at $commit"

      - name: Install dependencies
        run: npm ci

      - name: Build release archives
        run: npm run build:release

      - name: Check the archives before anything is published
        # This is the last point at which a bad build is cheap. A missing
        # platform or a zero-byte zip is otherwise discovered by a player, and by
        # then it is already a published release. Matching on the exact names
        # rather than on a count is deliberate: three wrong names still means
        # three files.
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          for slug in win linux mac; do
            f="dist-release/rogue_survivor_reloaded-${slug}-${VERSION}-${COMMIT}.zip"
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty: web/$f"
              echo "::error::dist-release/ actually contains:"
              ls -l dist-release/ || true
              exit 1
            fi
            echo "$(du -h "$f" | cut -f1)	$f"
          done
          stray="$(find dist-release -maxdepth 1 -name '*.zip' ! \
            -name "rogue_survivor_reloaded-win-${VERSION}-${COMMIT}.zip" \
            ! -name "rogue_survivor_reloaded-linux-${VERSION}-${COMMIT}.zip" \
            ! -name "rogue_survivor_reloaded-mac-${VERSION}-${COMMIT}.zip")"
          if [ -n "$stray" ]; then
            echo "::warning::unexpected archives in dist-release/, not uploaded:"
            echo "$stray"
          fi

      - name: Summarise
        if: always()
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          {
            echo "### Archives"
            echo
            echo "| Platform | Archive | Size | SHA-256 |"
            echo "|---|---|---|---|"
            for slug in win linux mac; do
              f="dist-release/rogue_survivor_reloaded-${slug}-${VERSION}-${COMMIT}.zip"
              [ -f "$f" ] || continue
              printf '| %s | `%s` | %s | `%s` |\n' \
                "$slug" "$(basename "$f")" \
                "$(du -h "$f" | cut -f1)" \
                "$(sha256sum "$f" | cut -d' ' -f1)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        # Path is workspace-relative: `working-directory` applies to `run` steps
        # only, not to `uses`.
        with:
          name: release-archives
          path: web/dist-release/*.zip
          if-no-files-found: error
          retention-days: 7

  payload:
    name: publish the update payload branch
    needs: build
    # A dry run publishes nothing at all, the branch included. Half a release is
    # not a smaller release: a payload on the branch with no release naming it is
    # a state no version of this project should ever be observable in.
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist-release

      - name: Publish the payload as a single-commit branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail

          # One archive is enough. `build-release.mjs` copies the same web build
          # into all three platform folders, so the payload is identical in each
          # — which the manifest in it is the evidence for, and the reason the
          # branch is published once rather than three times.
          zip="$(ls dist-release/rogue_survivor_reloaded-linux-*.zip)"
          rm -rf payload
          mkdir payload
          unzip -q "$zip" -d payload

          # Found by the manifest rather than by folder name, so a packaging
          # change that renames or reshapes the layout fails here instead of
          # quietly publishing an empty branch.
          root="$(dirname "$(find payload -maxdepth 3 -name latest.json -print -quit)")"
          if [ ! -f "$root/payload.json" ]; then
            echo "::error::no payload.json beside latest.json in $root"
            exit 1
          fi
          if [ -f "$root/sw.js" ]; then
            echo "::error::sw.js is in the payload; it would register over localhost and cache-first the assets the update just replaced"
            exit 1
          fi
          want="$(node -p "require('./$root/latest.json').version")"
          if [ "$want" != "$VERSION" ]; then
            echo "::error::payload says $want but this run built $VERSION"
            exit 1
          fi
          files="$(node -p "Object.keys(require('./$root/payload.json').files).length")"
          echo "payload: $files files at $VERSION ($COMMIT)"

          # A fresh repository, not an orphan branch of this checkout: nothing in
          # the release tree should be reachable from the push, and the branch is
          # one commit by construction. That bounds the repo at one copy of the
          # payload instead of one per release, with the tags and the releases as
          # the record of what has shipped — an update never needs the history.
          work="$(mktemp -d)"
          cp -R "$root"/. "$work"/
          cd "$work"
          git init -q -b payload
          git add -A
          git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -q -m "payload $VERSION ($COMMIT)"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # The token goes in a header rather than the remote URL, so it cannot
          # end up in `.git/config`, in a `git remote -v` pasted into an issue,
          # or in a pack file's error message.
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
              push --force --quiet origin HEAD:refs/heads/payload
          echo "pushed payload branch at $(git rev-parse --short HEAD)"

          # And a tag on the same commit, which is how an installed build
          # addresses the payload files. A branch name is a mutable reference, and
          # raw caches branch tips for five minutes — fine for the 97-byte
          # `latest.json` that has to be discovered, wrong for the 2 436 files
          # whose bytes are compared against a manifest. The version cannot be
          # republished (three files pinned to one string by `version.test.ts`),
          # so the tag name is as immutable as the commit is. Force-pushed
          # because re-running this workflow for a tag that already exists
          # replaces its archives rather than failing, and this must agree.
          git tag "payload-$VERSION"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
              push --force --quiet origin "refs/tags/payload-$VERSION"
          echo "pushed tag payload-$VERSION"

  publish:
    name: create the GitHub release
    needs: [build, payload]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # No `defaults.run.working-directory` here, unlike the build job: this job
    # has no npm steps, and the artifact was downloaded to `dist-release/` at the
    # workspace root. Setting it to `web` would make every glob below resolve to
    # `web/dist-release/`, which is not where anything is.

    steps:
      - uses: actions/checkout@v4
        # Required, and the reason this job failed. `gh release create` creates the
        # tag through a local repository, so without a checkout it aborts with
        # `fatal: not a git repository` - this job downloads an artifact and
        # otherwise never puts a `.git` on disk.
        #
        # `fetch-depth: 0` because `--target` may name a commit that a shallow
        # checkout of the default branch does not contain: this workflow can be
        # dispatched from a feature branch with `allow_off_default_branch`, and the
        # archives are built from that branch's commit.
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist-release

      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            if [ "$tag" != "v$VERSION" ]; then
              echo "::warning::using your tag $tag, but the archives are named for version $VERSION"
              echo "::warning::bump web/package.json and web/neutralino.config.json if that was not intended"
            fi
          else
            tag="v$VERSION"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag: $tag"

      - name: Build the release body
        # Notes typed in the dispatch box win. Otherwise this is a manifest: what
        # is attached, how big, and what it hashes to - the part a reader of a
        # release page actually needs, and the part nobody writes down by hand.
        env:
          INPUT_NOTES: ${{ inputs.notes }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_NOTES" ]; then
            printf '%s\n' "$INPUT_NOTES" > release-notes.md
            cat release-notes.md
            exit 0
          fi
          {
            echo "Desktop build \`$TAG\` of Rogue Survivor Reloaded $VERSION."
            echo
            echo "Download the archive for your platform, unpack it, and run the binary."
            echo "Each archive holds the client and the whole game payload, so there is nothing else to install."
            echo
            echo "| Platform | Archive | Size | SHA-256 |"
            echo "|---|---|---|---|"
            for slug in win linux mac; do
              for f in dist-release/rogue_survivor_reloaded-"$slug"-*.zip; do
                [ -f "$f" ] || continue
                bytes="$(stat -c%s "$f")"
                mb="$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')"
                printf '| %s | `%s` | %s MB | `%s` |\n' \
                  "$slug" "$(basename "$f")" "$mb" \
                  "$(sha256sum "$f" | cut -d' ' -f1)"
              done
            done
            echo
            echo "The Linux archive holds \`linux_arm64\`, \`linux_armhf\` and \`linux_x64\`."
            echo "The macOS archive holds \`mac_arm64\`, \`mac_universal\` and \`mac_x64\`."
            echo
            echo "Built from \`$SHA\`."
          } | tee release-notes.md

      - name: Create the release, or replace its archives
        # `gh release create` is the GitHub CLI already on the runner, rather
        # than a third-party action: it is one less thing whose permissions and
        # behaviour we would have to take on trust for a step that can create a
        # tag.
        #
        # `--draft`/`--prerelease` take explicit =true/=false so the dispatch
        # booleans cannot be swallowed by a shell that eats the value as another
        # argument. `gh` marks the newest non-draft, non-prerelease release as
        # "latest" on its own, so there is no --latest flag to get wrong.
        #
        # Re-running the workflow for a tag that already exists replaces the
        # archives rather than failing, which is the only sane behaviour when the
        # only thing that changed between two runs is the build.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET: ${{ github.sha }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists; replacing its archives"
            gh release upload "$TAG" dist-release/*.zip --clobber
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --draft="$DRAFT" \
              --prerelease="$PRERELEASE"
          else
            echo "creating release $TAG at $TARGET"
            gh release create "$TAG" dist-release/*.zip \
              --target "$TARGET" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --draft="$DRAFT" \
              --prerelease="$PRERELEASE"
          fi

      - name: Confirm
        # Read the release back rather than trusting that the create succeeded:
        # a draft, or an archive that gh silently skipped, is the kind of thing
        # you want to see in the log and not discover from the release page.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json url,isDraft,isPrerelease,tagName,assets \
            --jq '"release : \(.tagName)\nurl     : \(.url)\ndraft   : \(.isDraft)\nprerelease: \(.isPrerelease)\nassets  :\n" + ([.assets[] | "  \(.name)  \(.size) bytes"] | join("\n"))'
          count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          if [ "$count" -lt 3 ]; then
            echo "::error::release $TAG has $count assets, expected 3"
            exit 1
          fi
