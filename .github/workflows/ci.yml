# Phase 8 CI for the browser port.
#
# The point of this workflow is the lesson from §1.1 of BROWSER_PORT_PLAN.md:
# for four phases "0 stubs + green tsc + green build" was treated as done, and
# the first actual execution of the engine then found nine runtime bugs, two of
# them fatal. So this runs the engine, not just the compiler:
#
#   1. type-check   - includes tests/ (they are in tsconfig.json's include list)
#   2. coverage     - 148 tests incl. a real headless playthrough, thresholds enforced
#   3. build        - the real Vite production build
#   4. sim          - a short seeded headless run, as an independent smoke check
#
# A second job builds the production Docker image from the repository root and
# smoke-tests the container over HTTP.
#
# Step 4 is deliberately redundant with the integration test. It exercises the
# shipped `npm run sim` path (esbuild bundle + node), which the in-process test
# does not, and a seeded run is reproducible so a failure here is a real signal
# rather than flaky.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref; a new push makes the old one moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: type-check, test, build, sim
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Scoped to this job on purpose, NOT set workflow-wide. The npm scripts all
    # live in web/, but the Dockerfile is built from the repository root, and a
    # workflow-level `defaults.run.working-directory` silently applies to every
    # job -- which is how `docker build .` came to run inside web/ and look for
    # web/Dockerfile.
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Headless simulation smoke run
        # Fixed seed so this is deterministic: the same world every time, and a
        # failure here is reproducible locally with the identical command.
        run: npm run sim -- --size 1 --turns 30 --seed 12345 --undead

      - name: Test and build under a subdirectory base
        # Pages serves the game from /Rogue-Survivor-Reloaded/game/, and every
        # step above runs at the default base of "/". Running both halves is the
        # point: a base is easy to leave hardcoded in one place, and a hardcoded
        # "/assets" under a subdirectory does not fail a test — it ships a black
        # screen, because the port preloads all 1 124 sprites before the first
        # frame and cannot draw one it has not fetched.
        #
        # check-base is the real gate. It greps the built output for a
        # root-absolute URL, which is the failure the test suite structurally
        # cannot see. It only has teeth here: at base "/" a root-absolute URL is
        # correct by definition, so running it against a root build would pass
        # while asserting nothing.
        env:
          BASE_PATH: /Rogue-Survivor-Reloaded/game/
        run: |
          npm run type-check
          npm run build
          npm run check:base

      - name: Test under a subdirectory base
        env:
          BASE_PATH: /Rogue-Survivor-Reloaded/game/
        run: npm run test:coverage

      - name: Assemble the site and validate it
        # Same script the Pages deploy runs, so a broken assembly fails here
        # rather than in a deploy. It asserts the files the published site needs
        # and that the game's service worker carries a stamped cache version.
        env:
          BASE_PATH: /Rogue-Survivor-Reloaded/game/
        run: |
          npm run build:site
          node ../docs/tools/check-site.mjs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: web/coverage/lcov.info
          if-no-files-found: ignore

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # No working-directory override, so these steps run at the repository root.
    # That is required: the Dockerfile's context is the repo root, because it
    # COPYs web/package-lock.json and relies on .dockerignore keeping the C#
    # original in src/ (58 MB) out of the upload. `docker build .` from web/
    # fails with "no such file or directory", so keep this job off the web/
    # default that the verify job sets.
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t rogue-survivor-web:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name rs-test -p 8080:8080 rogue-survivor-web:ci
          # Poll rather than sleep-and-hope: the server may take a moment, and
          # CI runners vary.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "server responded after ${i}s"
              curl -fsS http://localhost:8080/ | head -c 200
              echo
              docker rm -f rs-test
              exit 0
            fi
            sleep 1
          done
          echo "server did not respond within 30s"
          docker logs rs-test
          docker rm -f rs-test
          exit 1
