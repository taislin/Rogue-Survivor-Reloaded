<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A zombie-survival roguelike. Explore, scavenge, and try to outlive the night." />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Rogue Survivor Reloaded</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: "Lucida Console", "Courier New", monospace;
      }

      #gameCanvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        /* Scale the 1024x768 canvas to fit the viewport while preserving aspect ratio */
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 1024 / 768;
      }

      #loading {
        position: fixed;
        inset: 0;
        background: #000;
        color: #0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        gap: 1rem;
        z-index: 100;
      }

      #loading.hidden {
        display: none;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #0f0;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <span>Loading Rogue Survivor Reloaded…</span>
    </div>
    <canvas id="gameCanvas" width="1024" height="768"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
