<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A zombie-survival roguelike. Explore, scavenge, and try to outlive the night." />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Favicon is icon-reloaded.png, the game's own art. Declared without a
      `sizes` hint so the browser picks it at any tab size (a 256x256 image
      scaled down), and `type` is omitted so it also works if the file is ever
      swapped for a non-PNG. The /icon-192.png links below are kept for
      apple-touch-icon, which wants a large opaque square.
    -->
    <link rel="icon" href="/icon-reloaded.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Rogue Survivor Reloaded</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: "Lucida Console", "Courier New", monospace;
      }

      #gameCanvas {
        display: block;
        /*
         * Smooth scaling, not pixelated. The canvas mixes 32px sprite art with
         * 8.25pt text; pixelated upscaling keeps sprites crisp but turns the
         * text into unreadable blocks, and text legibility wins. Sprites stay
         * sharp at integer scales and soften slightly at fractional ones.
         */
        image-rendering: auto;
        /* Scale the 1366x768 canvas to fit the viewport while preserving aspect ratio */
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 1366 / 768;
      }

      #loading {
        position: fixed;
        inset: 0;
        background: #000;
        color: #0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        gap: 1rem;
        z-index: 100;
      }

      #loading.hidden {
        display: none;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #0f0;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <span>Loading Rogue Survivor Reloaded…</span>
    </div>
    <canvas id="gameCanvas" width="1366" height="768"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
